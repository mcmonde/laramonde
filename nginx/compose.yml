services:
  nginx:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.30-alpine}
    restart: unless-stopped
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:8080"
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${APP_CODE_PATH_HOST:-./apps}:${APP_CODE_PATH_CONTAINER:-/var/www/apps}:ro
      - ./certbot/www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPUS:-2}
          memory: ${NGINX_MEMORY:-256M}
