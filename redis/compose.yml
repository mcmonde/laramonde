services:
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    # Root only long enough for acl-boot.sh to build the ACL file and drop
    # privileges through the image entrypoint. The default user keeps
    # REDIS_PASSWORD; per-app users come from redis/acl/apps.acl.
    user: "0:0"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD — run ./dock setup}
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-acl-boot.sh"]
    command:
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - DEBUG
      - ""
      - --protected-mode
      - "yes"
    volumes:
      - redis_data:/data
      - ./redis/acl-boot.sh:/usr/local/bin/redis-acl-boot.sh:ro
      - ./redis/acl:/acl:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPUS:-2}
          memory: ${REDIS_MEMORY:-4G}
